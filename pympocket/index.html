<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PymPocket: registrá tus gastos en segundos y entendé en qué se va tu dinero. Pesos, dólares y euros.">
  <meta name="theme-color" content="#6d28d9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PymPocket">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PymPocket</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3m0 0L7 8m5-5 5 5M4 21h16"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20z"/><path d="M12 10v4M12 18h.01"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-fingerprint" viewBox="0 0 24 24"><path d="M12 11v3a8 8 0 0 1-1.5 4.5"/><path d="M8 13.5V11a4 4 0 0 1 8 0v1.5a12 12 0 0 1-.8 4.3"/><path d="M5 15V11a7 7 0 0 1 12.5-4.3"/><path d="M19 10.5c.1.5.2 1 .2 1.5v1a15 15 0 0 1-.6 4"/><path d="M8.5 20.5A10 10 0 0 0 11 14"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.5-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></symbol>
    <symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.5-10M10 6.3A6 6 0 0 1 18 9a4.5 4.5 0 0 1 2.5 7.6M17.5 18H7"/><path d="m3 3 18 18"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  </svg>

  <a class="skip-link" href="#main" data-i18n="nav.skip">Ir al contenido</a>

  <header class="topbar">
    <a class="brand" href="#/inicio" aria-label="PymPocket">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Pym<strong>Pocket</strong></span>
    </a>
    <div class="topbar-right">
      <button id="sync-badge" class="sync-badge" type="button" data-action="sync-now" hidden></button>
      <a id="rate-badge" class="rate-badge" href="#/mas#moneda"></a>
    </div>
  </header>

  <div id="demo-banner" class="demo-banner" role="status" hidden></div>
  <div id="offline" class="offline" role="status" hidden data-i18n="offline">Sin conexión: tus cambios se guardan en este dispositivo.</div>

  <nav class="sidenav" data-i18n-aria="nav.label" aria-label="Secciones">
    <a href="#/inicio" data-nav="inicio"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span data-i18n="nav.home">Inicio</span></a>
    <a href="#/movimientos" data-nav="movimientos"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span data-i18n="nav.movements">Movimientos</span></a>
    <a href="#/analisis" data-nav="analisis"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span data-i18n="nav.analysis">Análisis</span></a>
    <a href="#/presupuestos" data-nav="presupuestos" class="desktop-only"><svg class="icon" aria-hidden="true"><use href="#i-wallet"/></svg><span data-i18n="nav.budgets">Presupuestos</span></a>
    <a href="#/metas" data-nav="metas" class="desktop-only"><svg class="icon" aria-hidden="true"><use href="#i-target"/></svg><span data-i18n="nav.goals">Metas</span></a>
    <a href="#/mas" data-nav="mas"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg><span data-i18n="nav.more">Más</span></a>
  </nav>

  <main id="main" class="main" tabindex="-1">
    <p class="loading" data-i18n="common.loading">Cargando…</p>
  </main>

  <button id="fab" class="fab" type="button" data-action="new-movement" data-i18n-aria="nav.add" aria-label="Cargar gasto">
    <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="fab-label" data-i18n="nav.addShort">Cargar gasto</span>
  </button>

  <div id="lock" class="lock" hidden></div>
  <dialog id="dialog" aria-modal="true"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="card">PymPocket necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
