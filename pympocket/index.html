  <meta name="theme-color" content="#6d28d9">
  <script>
    // Tema antes de dibujar la página (así no hay un destello del tema equivocado).
    // Preferencia guardada en este dispositivo: "auto" (como el sistema), "light" o "dark".
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function apply() {
        var pref = 'auto';
        try { pref = localStorage.getItem('pympocket.theme') || 'auto'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && media.matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#121019' : '#6d28d9');
      }
      apply();
      if (media.addEventListener) media.addEventListener('change', apply);
      window.__pymApplyTheme = apply;
    })();
  </script>

  <!-- Pantalla de carga: la moneda cae en el bolsillo mientras arranca la app -->
  <div id="splash" class="splash" role="status">
    <svg class="splash-logo" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="splash-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b5cf6"/>
          <stop offset="1" stop-color="#5b21b6"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#splash-bg)"/>
      <path d="M128 150h256v150c0 70-57 112-128 112S128 370 128 300z" fill="#fff"/>
      <path class="splash-stitch" d="M150 182h212" stroke="#c4b5fd" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
      <g class="splash-coin">
        <circle cx="256" cy="292" r="62" fill="#6d28d9"/>
        <text x="256" y="317" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="76" fill="#fff">$</text>
      </g>
    </svg>
    <p class="splash-name">Pym<strong>Pocket</strong></p>
    <div class="splash-bar" aria-hidden="true"><span></span></div>
    <span class="sr-only" data-i18n="common.loading">Cargando…</span>
  </div>
  <script>
    // Resguardo independiente del resto de la app: si los módulos no cargan
    // (por ejemplo, al abrir el archivo con doble clic), hay un error al
    // arrancar o tarda demasiado, la pantalla de carga avisa y ofrece reintentar.
    (function () {
      var splash = document.getElementById('splash');
      function fail(reason) {
        if (!document.body.contains(splash) || splash.getAttribute('data-failed')) return;
        splash.setAttribute('data-failed', reason);
        splash.querySelector('.splash-bar').hidden = true;
        var box = document.createElement('div');
        box.className = 'splash-error';
        box.setAttribute('role', 'alert');
        var lang = 'es';
        try { lang = localStorage.getItem('pympocket.lang') || (navigator.language || 'es').slice(0, 2); } catch (e) {}
        var texts = {
          es: ['PymPocket no se puede abrir con doble clic.', 'Para probarla en tu computadora, usá el archivo <strong>Probar PymPocket.bat</strong> de la carpeta PymTech (o ver README.md).', 'No pudimos abrir PymPocket.', 'Puede ser una versión vieja guardada en este navegador.', 'Reintentar'],
          en: ['PymPocket can’t be opened by double-clicking the file.', 'To try it on your computer, use <strong>Probar PymPocket.bat</strong> in the PymTech folder (or see README.md).', 'We couldn’t open PymPocket.', 'An old version may be saved in this browser.', 'Try again'],
          pt: ['O PymPocket não pode ser aberto com clique duplo.', 'Para testar no computador, use o arquivo <strong>Probar PymPocket.bat</strong> da pasta PymTech (ou veja o README.md).', 'Não conseguimos abrir o PymPocket.', 'Pode ser uma versão antiga salva neste navegador.', 'Tentar de novo'],
        };
        var m = texts[lang] || texts.es;
        box.innerHTML = location.protocol === 'file:'
          ? '<p><strong>' + m[0] + '</strong></p><p>' + m[1] + '</p>'
          : '<p><strong>' + m[2] + '</strong></p><p>' + m[3] + '</p><button type="button" class="btn btn-primary">' + m[4] + '</button>';
        splash.appendChild(box);
        var retry = box.querySelector('button');
        if (retry) retry.onclick = function () {
          retry.disabled = true;
          var steps = [];
          if (navigator.serviceWorker) steps.push(navigator.serviceWorker.getRegistrations().then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) steps.push(caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); }));
          Promise.all(steps).catch(function () {}).then(function () { location.reload(); });
        };
      }
      // Un error durante el arranque solo se informa si la app no termina de abrir en unos segundos.
      function failSoon(reason) { setTimeout(function () { fail(reason); }, 3000); }
      window.__pymSplashFail = fail;
      window.addEventListener('error', function () { failSoon('error'); });
      window.addEventListener('unhandledrejection', function () { failSoon('error'); });
      setTimeout(function () { fail('timeout'); }, 15000);
      if (location.protocol === 'file:') fail('file');
    })();
  </script>
